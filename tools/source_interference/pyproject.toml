[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readability-data"
version = "0.18.0"
description = "Reproducible source-level degradation for complete Java and Python classes"
requires-python = ">=3.10"
dependencies = [
  "tree-sitter==0.25.2",
  "tree-sitter-java==0.23.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
dev = ["pytest>=8.0.0", "ruff==0.16.7"]

[project.scripts]
readability-data = "readability_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["readability_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".git", ".venv"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["F", "I"]
